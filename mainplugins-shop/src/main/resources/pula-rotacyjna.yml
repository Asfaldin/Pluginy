# Pula itemów do sklepu rotacyjnego (kategoria "Kolekcja").
# RotacjaManager losuje stąd 5 pozycji co 14 dni i wpisuje je do
# categories/kolekcja.yml (sloty 0-4). Cała kategoria jest rotacyjna —
# Generator Bruku ma teraz stałe miejsce w kategorii "Rudy i Minerały".
#
# Każdy wpis: material + display-name + buy-price (za 1 sztukę).
# Itemy z 'custom-id' są kupowane ścieżką customową w ShopManager - tu ich nie ma,
# wszystkie pozycje to zwykłe wanilijskie materiały.

itemy:
  # ---- PŁYTY MUZYCZNE (15) - cena rośnie co 10k wg rzadkości w wanilii ----
  - {material: MUSIC_DISC_13, nazwa: "Płyta: 13", cena: 10000}
  - {material: MUSIC_DISC_CAT, nazwa: "Płyta: Cat", cena: 20000}
  - {material: MUSIC_DISC_BLOCKS, nazwa: "Płyta: Blocks", cena: 30000}
  - {material: MUSIC_DISC_CHIRP, nazwa: "Płyta: Chirp", cena: 40000}
  - {material: MUSIC_DISC_FAR, nazwa: "Płyta: Far", cena: 50000}
