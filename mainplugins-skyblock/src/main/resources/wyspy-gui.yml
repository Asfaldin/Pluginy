# Uklad wszystkich GUI systemu wysp (mainplugins-skyblock) - w pelni edytowalny bez
# rekompilacji. Liczby/dane (koszty, promienie, timeouty...) sa w OSOBNYM pliku -
# patrz wyspy-config.yml. Przeladowanie na zywo, bez restartu serwera: /@reloadwyspy
#
# Kazdy ekran: { size, tlo (opcjonalny material tla, domyslnie GRAY_STAINED_GLASS_PANE),
#                przyciski: lista {slot, akcja, material, material-wylaczone?, nazwa, kolor?, lore} }
# "akcja" to identyfikator zachowania (co sie dzieje po kliknieciu) - NIE zmieniaj tych
# identyfikatorow, tylko slot/material/nazwa/kolor/lore dookola nich. Przeniesienie przycisku
# na inny slot automatycznie przenosi tez obsluge kliku (klik jest routowany po akcji, nie po
# na sztywno wpisanym numerze slotu).
#
# "kolor" to kolor tytulu przycisku (nazwa NamedTextColor, np. RED, DARK_RED, AQUA,
# LIGHT_PURPLE...) - opcjonalny, domyslnie YELLOW przy braku/zlej wartosci.
#
# "material-wylaczone" dotyczy WYLACZNIE przycisku-przelacznika (dwustanowego): "material"
# to ikona w stanie wlaczonym, "material-wylaczone" w stanie wylaczonym. Linia "Stan: ..."
# i "Kliknij, aby przelaczyc" sa dopisywane automatycznie pod lore i NIE trzeba ich podawac.
#
# Niektore przyciski maja DWA warianty pod tym samym slotem (np. Usun/Opusc Wyspe, Wroc do
# Menu/Zamknij Panel) - serwer sam wybiera wlasciwy wariant w zaleznosci od stanu gracza
# (wlasciciel/czlonek, wejscie z /menu czy bezposrednio /is), wiec obie definicje MUSZA
# wskazywac na ten sam slot.

panel-wyspy:
  size: 54
  przyciski:
    - { slot: 10, akcja: TELEPORT, material: OAK_DOOR, nazwa: "Teleport na Wyspę", kolor: GREEN,
        lore: ["Kliknij, aby wrócić do siebie"] }
    - { slot: 12, akcja: ULEPSZENIA, material: BEACON, nazwa: "Ulepszenia Wyspy", kolor: GOLD,
        lore: ["Zwiększ rozmiar wyspy"] }
    - { slot: 14, akcja: BANK, material: GOLD_INGOT, nazwa: "Bank Wyspy", kolor: YELLOW, lore: [] }
    - { slot: 16, akcja: INFO, material: PAPER, nazwa: "Informacje o Wyspie", kolor: AQUA, lore: [] }
    - { slot: 20, akcja: USTAWIENIA, material: COMPARATOR, nazwa: "Ustawienia Wyspy", kolor: BLUE,
        lore: ["Border, budowanie, PvP, moby, pogoda, nazwa...", "Kliknij, aby zarządzać"] }
    - { slot: 22, akcja: PERMISJE, material: LEVER, nazwa: "Permisje", kolor: RED,
        lore: ["Itemy, skrzynie, drzwi i mechanizmy dla gości", "Kliknij, aby zarządzać"] }
    - { slot: 24, akcja: TOPKA, material: GOLD_BLOCK, nazwa: "Topka Wysp", kolor: GOLD,
        lore: ["Ranking wysp według wartości"] }
    - { slot: 53, akcja: USUN_WYSPE, material: TNT, nazwa: "Usuń Wyspę", kolor: DARK_RED,
        lore: ["Ostrzeżenie: Wyspa zniknie bezpowrotnie!"] }
    - { slot: 53, akcja: OPUSC_WYSPE, material: OAK_BOAT, nazwa: "Opuść Wyspę", kolor: RED,
        lore: ["Samodzielnie zrezygnujesz z członkostwa"] }
    - { slot: 49, akcja: WROC_DO_MENU, material: NETHER_STAR, nazwa: "« Wróć do Menu głównego", kolor: RED, lore: [] }
    - { slot: 49, akcja: ZAMKNIJ_PANEL, material: BARRIER, nazwa: "Zamknij Panel", kolor: RED, lore: [] }

