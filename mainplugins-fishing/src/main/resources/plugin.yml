name: MainpluginsFishing
version: ${project.version}
main: elo.mainplugins.fishing.MainpluginsFishing
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  wedka:
    description: Daj sobie wędkę do specjalnego łowienia.
  rybpasek:
    description: Ustaw gdzie ma się wyświetlać pasek minigry łowienia (gora ekranu / dol nad paskiem XP)
    usage: "/<command> <gora|dol>"
  rybtop:
    description: Top 10 najciezszych pojedynczych polowow na serwerze + rekord serwera
  rybiemenu:
    description: Dziennik Rybaka - glowne menu, w srodku m.in. indeks gatunkow ktore juz zlowiles
    aliases: [rmenu]
  wiaderko:
    description: "[TYMCZASOWE] Daj sobie Bezdenne Wiaderko - zbiera zlowione ryby zamiast ekwipunku"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@reloadfishing":
    description: Wczytaj fishing-config.yml i ryby.yml na nowo, bez restartu serwera
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@rybykomunikaty":
    description: "Awaryjnie wlacz/wylacz publiczne ogloszenia rybackie na czacie (rekordy, indeks) - np. przy bugu"
    usage: "/<command> <wlacz|wylacz>"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@resetrybtop":
    description: Wyczysc CALKOWICIE statystyki rybackie (suma kg, rekordy gatunkow) - nieodwracalne
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkazwykla:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości ZWYKLA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkaniezwykla:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości NIEZWYKLA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkarzadka:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości RZADKA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkaepicka:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości EPICKA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkalegendarna:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości LEGENDARNA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkamityczna:
    description: "[TEST] Wędka wymuszająca losowy gatunek rzadkości MITYCZNA, branie prawie natychmiastowe"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkazrownowazona:
    description: "[TEST] Wędka profilu Zrównoważona (baseline, bez zmian) - normalne losowanie gatunku"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkacierpliwa:
    description: "[TEST] Wędka profilu Cierpliwego - szerszy suwak/wolniejsza ryba, wolniejszy połów, szanse w stronę pospolitszych ryb"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  wedkaszarpana:
    description: "[TEST] Wędka profilu Szarpana - wąski suwak/szybka ryba, szybki połów przy trafieniu, szanse w stronę rzadszych ryb"
    permission: mainplugins.fishing.admin
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.fishing.admin:
    description: Dostęp do przeładowania konfiguracji łowienia i wędek testowych
    default: op
