name: MainpluginsCore
version: ${project.version}
main: elo.mainplugins.core.MainpluginsCore
api-version: '1.20'

commands:
  adminhelp:
    description: Panel administratora - moduły, statystyki i wszystkie komendy
    permission: mainplugins.core.admin
  komendy:
    description: Lista wszystkich komend serwera, pogrupowana segmentami
  moneyadd:
    description: "[TEST] Dodaj kasę graczowi"
    permission: mainplugins.core.moneyadd
    usage: /<command> [gracz] <kwota>
  moneyundo:
    description: "[TEST] Wyzeruj kasę graczowi"
    permission: mainplugins.core.moneyadd
    usage: /<command> [gracz]

permissions:
  mainplugins.core.admin:
    description: Dostęp do /adminhelp
    default: op
  mainplugins.core.moneyadd:
    description: Dostęp do testowego doładowania/zerowania ekonomii
    default: op