# ==========================================================================
# resourcepack.yml - adres i hash paczki z niewidzialnym fontem do wyrownania
# Tab-a (gorna tabela graczy). Zrodlo samej paczki: mainplugins-hud/resourcepack/
# w repo (NIE w tym pliku resources) - spakuj ten folder do .zip i wgraj np. na
# mc-packs.net, ktory poda gotowy link + poprawny hash SHA-1.
#
# url      - publiczny link HTTPS do pliku .zip
# hash     - SHA-1 pliku .zip (dokladnie ten, ktory poda hosting - jesli hosting
#            przepakowuje plik, hash MOZE byc inny niz z lokalnego zip-a!)
# wymagany - true = gracz bez akceptacji nie wejdzie na serwer
#            false = kosmetyczny - kto odrzuci, dostaje stary uklad taba
#            (dopelnianie spacjami zamiast idealnego wyrownania co do piksela)
#
# Puste url = paczka WYLACZONA (nic nie jest wysylane graczom, sam stary uklad).
# ==========================================================================

url: ""
hash: ""
wymagany: false