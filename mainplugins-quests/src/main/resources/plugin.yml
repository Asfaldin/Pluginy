name: MainpluginsQuests
version: ${project.version}
main: elo.mainplugins.quests.MainpluginsQuests
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  zadania:
    description: Zadania
    aliases: [quest]
  "@reloadquesty":
    description: (Admin) Wczytaj quests-content.yml na nowo, bez restartu serwera
    permission: mainplugins.quests.reloadquesty
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.quests.reloadquesty:
    description: Dostep do przeladowania quests-content.yml
    default: op
