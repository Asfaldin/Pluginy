# Server language for every Mainplugins plugin: "en" or "pl".
# You can add your own language: copy plugins/<Plugin>/lang/en.yml to lang/<code>.yml,
# translate it and put the code here. Missing texts fall back to English.
language: en

# Whose money Mainplugins uses:
#   own   - our own economy (default). If Vault is installed, other plugins can use it too.
#   vault - money of another plugin through Vault (e.g. EssentialsX). Needs Vault + that plugin.
#           The "richest players" ranking is not available in this mode.
economy: own

# Admin helper: /@rewardtest <player> gives this list (handy for checking reward setups).
test-rewards:
  - money: 100
  - item: DIAMOND
    amount: 2
