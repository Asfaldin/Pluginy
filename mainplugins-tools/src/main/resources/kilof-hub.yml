# ==========================================================================
# kilof-hub.yml - uklad menu "Kilof - Umiejetnosci" (Shift + PPM kilofem).
# Model kart (roguelike level-up) - ten sam silnik co siekiera/motyka/miecz. Mozna
# zmienic tu rozmiar okna oraz pozycje (sloty) kazdej ikonki bez przebudowy pluginu,
# wystarczy zmienic plik i zrestartowac serwer.
#
# rozmiar: liczba slotow. Musi byc wielokrotnoscia 9 w zakresie 9-54 - inna wartosc
# zostanie zaokraglona w gore do najblizszej wielokrotnosci 9 i przycieta do 54.
#
# sloty: numeracja od 0 (lewy gorny rog) do rozmiar-1 (prawy dolny rog), rzedami po 9.
# Kazdy slot powinien byc unikalny.
#
# wybor_karty - centralny przycisk: swieci, gdy czeka oferta 4 kart do wyboru (po
# kazdym levelu). info - beacon otwierajacy menu Informacje (Statystyki/Rzadkie Perki/
# Umiejetnosci/Kombinacje, wszystko jako bloczki - patrz ToolSkillManager#openInfo).
# bonus_bruku - jedyna ikonka specyficzna dla kilofa: podglad/przelacznik bonusowego
# surowca z kopanego bruku (patrz BrukSurowceManager), stoi po lewej od wyjdz, info po
# prawej.
# ==========================================================================

rozmiar: 27

sloty:
  narzedzie: 4
  wybor_karty: 13
  bonus_bruku: 21
  wyjdz: 22
  info: 23