name: MainpluginsQuests
version: ${project.version}
main: elo.mainplugins.quests.MainpluginsQuests
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  quest:
    description: Zadania
  addfale:
    description: (Admin) Testowe uruchomienie 5 fal zombie Placzacego Obsydianu pod graczem, bez nagrody
    permission: mainplugins.quests.addfale
  addkruchy:
    description: (Admin) Testowe wydanie generatora kruchych surowcow + przewodnika
    permission: mainplugins.quests.addkruchy
  dajbrukgen:
    description: (Admin) Testowe wydanie Generatora Bruku
    permission: mainplugins.quests.dajbrukgen

permissions:
  mainplugins.quests.addfale:
    description: Testowe wywolanie fal zombie (komenda /addfale)
    default: op
  mainplugins.quests.addkruchy:
    description: Testowe wydanie generatora kruchych surowcow (komenda /addkruchy)
    default: op
  mainplugins.quests.dajbrukgen:
    description: Testowe wydanie Generatora Bruku (komenda /dajbrukgen)
    default: op