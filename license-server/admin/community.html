<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>RSMC Community</title>
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="community.css" />
  </head>
  <body class="cm">
    <!-- Zapisy ze strony i odpowiedzi ankiety - tylko konta z rolą admin. Logowanie w index.html. -->
    <header class="cm-head">
      <div class="brand">RSMC <span>Community</span></div>
      <nav class="cm-tabs">
        <button type="button" data-tab="visitors" class="on">Visitors</button>
        <button type="button" data-tab="signups">Sign-ups <span id="n-signups"></span></button>
        <button type="button" data-tab="survey">Survey <span id="n-survey"></span></button>
      </nav>
      <span class="cm-spacer"></span>
      <a class="ghost small cm-link" href="index.html">Support tickets</a>
      <button id="refresh" type="button" class="ghost small">Refresh</button>
    </header>

    <p id="error" class="error cm-error" hidden></p>

    <main id="visitors" class="cm-view">
      <div class="cm-bar">
        <div class="cm-range">
          <button type="button" data-range="1">Today</button>
          <button type="button" data-range="7" class="on">7 days</button>
          <button type="button" data-range="30">30 days</button>
          <button type="button" data-range="90">90 days</button>
        </div>
        <span class="cm-spacer"></span>
        <span class="muted small">Anonymous, no cookies · days in UTC</span>
      </div>
      <div class="cm-stats">
        <div><b id="v-visitors">0</b><span>visitors</span></div>
        <div><b id="v-views">0</b><span>page views</span></div>
        <div><b id="v-signups">0</b><span>sign-ups</span></div>
        <div><b id="v-conv">-</b><span>visitors who signed up</span></div>
      </div>
      <div id="v-chart" class="cm-chart"></div>
      <div id="v-tables" class="cm-summary"></div>
    </main>

    <main id="signups" class="cm-view" hidden>
      <div class="cm-stats">
        <div><b id="s-total">0</b><span>signed up</span></div>
        <div><b id="s-confirmed">0</b><span>confirmed</span></div>
        <div><b id="s-week">0</b><span>last 7 days</span></div>
      </div>
      <div class="cm-bar">
        <input id="s-search" type="search" placeholder="Search email..." />
        <label class="cm-check"><input id="s-only" type="checkbox" /> Only confirmed</label>
        <span class="cm-spacer"></span>
        <button id="s-csv" type="button">Export CSV</button>
      </div>
      <table class="cm-table">
        <thead><tr><th>Email</th><th>Status</th><th>Signed up</th><th>Confirmed</th><th>Source</th><th></th></tr></thead>
        <tbody id="s-rows"></tbody>
      </table>
    </main>

    <main id="survey" class="cm-view" hidden>
      <div class="cm-bar">
        <span id="v-count" class="muted"></span>
        <span class="cm-spacer"></span>
        <button id="v-csv" type="button">Export CSV</button>
      </div>
      <div id="v-summary" class="cm-summary"></div>
      <h3 class="cm-h">Answers</h3>
      <div id="v-list" class="cm-answers"></div>
    </main>

    <script src="community.js"></script>
  </body>
</html>
