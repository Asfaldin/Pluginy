# Konfiguracja lowienia (mainplugins-fishing) - tuning minigry i bonusowej skrzynki,
# w pelni edytowalny bez rekompilacji. Przeladowanie na zywo: /@reloadfishing
#
# Gatunki ryb NIE sa tutaj - patrz ryby.yml (osobny plik w tym samym folderze danych).

# Trudnosc minigry "pasek" zalezna liniowo od trudnosci = rzadkosc.ordinal() (0-5):
# polowa-szerokosci-suwaka(t) = clamp(bazowa + na-trudnosc*t, min, max), nadpisania per rzadkosc
# predkosc-ryby(t)            = clamp(bazowa + na-trudnosc*t, min, max), nadpisania per rzadkosc
# tempo-napelniania(t)        = clamp(bazowa + na-trudnosc*t, min, max), nadpisania per rzadkosc
# tempo-oprozniania(t)        = clamp(bazowa + na-trudnosc*t, min, max), nadpisania per rzadkosc
#
# "nadpisania" (opcjonalne, patrz FishingConfig.Formula) - jesli dana rzadkosc ma tu wpis,
# CALKOWICIE omija formule i dostaje dokladnie te wartosc, reszta rzadkosci dalej liczona
# normalnie z bazowa/na-trudnosc. Dodane 2026-08-31c po serii prob dostrojenia SAMEJ RZADKIEJ
# bez ruszania sasiadow (Zwykla/Niezwykla z jednej strony, Epicka+ z drugiej) - jedna wspolna
# prosta na wszystkie 6 rzadkosci fizycznie na to nie pozwala (kazda zmiana ciagnie za soba
# czesc krzywej), user: "nie musi byc liniowo... tych innych nie potrzeba zmieniac".
minigra:
  szerokosc-paska: 40
  grawitacja: 0.65
  impuls-kliknieca: 0.38
  # 1 = co tyknięcie serwera (20Hz), zmienione z 2 (10Hz) dla płynniejszej animacji paska -
  # patrz FishingMinigame. Fizyka i tak liczona przez dt, więc trudność się nie zmienia.
  okres-tickow: 1
  # Bez limitu czasu - ryba wyrywa się WYŁĄCZNIE gdy miernik połowu realnie spadnie do zera.
  #
  # Historia tuningu (user 2026-08-31c, wedka1 = startowa "1 wedka" do szybkiej wymiany):
  # - Lekki buff LEGENDARNEJ/MITYCZNEJ ("niemozliwe do zlowienia"): szerokosc-suwaka MITYCZNA
  #   0.05->0.06/LEGENDARNA 0.056->0.06, predkosc-ryby MITYCZNA 0.35->0.32 (cap),
  #   tempo-oprozniania LEGENDARNA/MITYCZNA 0.20->0.17 (cap, EPICKA tez lekko spada 0.18->0.17
  #   przy okazji tego capu - jedyny prawdziwie nieunikniony efekt uboczny w tym pliku)
  # - Odwrotny buff TRUDNOSCI Zwykla/Niezwykla (ma dawac lekka presje mimo bycia najlatwiejsza):
  #   tempo-oprozniania ZWYKLA 0.12->0.15/NIEZWYKLA 0.14->0.15 (min), tempo-napelniania
  #   ZWYKLA 0.18->0.16/NIEZWYKLA 0.165->0.16 (max) - wolniej sie nabija, szybciej ucieka
  # - RZADKA dostrojona NIEZALEZNIE przez nadpisania (patrz nizej) - Epicka+ i Zwykla/Niezwykla
  #   caly czas dokladnie na wartosciach z dwoch punktow wyzej, bez zadnych efektow ubocznych
  # - Jeszcze lekki dodatkowy buff tempa oprozniania (user: "jeszcze troche szybciej traca
  #   napelnienie jak sie nie trafia") na Zwykla/Niezwykla/Rzadka razem: min 0.15->0.16
  #   (Zwykla/Niezwykla +6.7%, Epicka+ nietkniete - dalej clampowane do tego samego sufitu
  #   0.17), RZADKA nadpisanie 0.165->0.17 (+3%, teraz na rowni z Epicka+)
  polowa-szerokosci-suwaka: {bazowa: 0.10, na-trudnosc: -0.011, min: 0.06, max: 0.10}
  predkosc-ryby: {bazowa: 0.10, na-trudnosc: 0.05, min: 0.0, max: 0.32}
  tempo-napelniania: {bazowa: 0.18, na-trudnosc: -0.015, min: 0.10, max: 0.16, nadpisania: {RZADKA: 0.14}}
  tempo-oprozniania: {bazowa: 0.12, na-trudnosc: 0.02, min: 0.16, max: 0.17, nadpisania: {RZADKA: 0.17}}

bonusowa-skrzynka:
  szansa-procent: 3.0
