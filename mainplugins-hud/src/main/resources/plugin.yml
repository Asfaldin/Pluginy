name: MainpluginsHUD
version: ${project.version}
main: elo.mainplugins.hud.MainpluginsHUD
api-version: '1.20'
depend: [MainpluginsCore]
softdepend: [PlaceholderAPI]
loadbefore: [TAB]

commands:
  "@reloadhud":
    description: Wczytaj hud-config.yml na nowo, bez restartu serwera
    permission: mainplugins.hud.reload
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.hud.reload:
    description: Pozwala przeladowac konfiguracje HUD/placeholderow
    default: op

# Ten modul juz nie renderuje wlasnego Taba (patrz historia - wlasny resourcepack/font
# byl zbyt kruchy: format paczki, hosting, przepelnienie tekstu). Zamiast tego wystawia
# dane Skyblocka jako placeholdery %mainplugins_...% (patrz MainpluginsPlaceholders) do
# uzycia w pluginie TAB (NEZNAMY) - to on odpowiada za wyglad/wyrownanie Taba.
#
# loadbefore: [TAB] jest KRYTYCZNE - TAB przy wlasnym starcie raz skanuje, ktore
# placeholdery PlaceholderAPI istnieja ("X placeholder hook(s) registered!" w logu).
# Bez tego HUD (a wiec i ekspansja "mainplugins") wlaczal sie PO TAB, wiec TAB widzial
# "0 placeholder hook(s) registered!" i traktowal %mainplugins_...% jak martwe -
# stad puste kolumny w layoucie mimo poprawnego configu.