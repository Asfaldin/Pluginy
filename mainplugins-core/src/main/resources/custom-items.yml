      - "&f▪ 2x Węgiel"
      - "&f▪ 1x Sztabka Miedzi"
      - "&f▪ 2x Ziemia"
      - ""
      - "&8Wrzuć wszystko do stołu rzemieślniczego -"
      - "&8pozycja w siatce nie ma znaczenia."

  # Gatunki lowienia (mainplugins-fishing, ryby.yml) - WSZYSTKIE 30 (2026-08-29, 5 na
  # kazda z 6 rzadkosci) maja tu wlasny model. Oryginalne 6 (ZWYKLA/NIEZWYKLA/RZADKA, po
  # 2 kazda) uzywaja namespace "mainplugins" (AllTheFish V4, wybrane recznie i przepakowane
  # do mainplugins-core/resourcepack/assets/mainplugins/...). Pozostale 24 (w tym caly
  # EPICKA/LEGENDARNA/MITYCZNA) uzywaja namespace "barely_default" - modele POZYCZONE z
  # duzo wiekszej biblioteki tego samego autora, "AllTheFish V4 - 26.2" (200 gatunkow w
  # paczce), skopiowane do mainplugins-core/resourcepack/assets/barely_default/ bez zmian.
  # Gdyby jakis gatunek w ryby.yml zostal dodany BEZ wpisu tutaj, dostanie zwykly
  # przefarbowany wanilijski material budowany w Javie (fallback, patrz FishingManager).
  #
  # UWAGA: pole "model" tu jest AKTYWNE - wymaga zaktualizowanej live paczki (nowy zip
  # spakowany z mainplugins-core/resourcepack/ + nowy link/hash w resourcepack.yml na
  # serwerze), inaczej gracze z paczka zobacza fioletowo-czarny blok "brak modelu"
  # zamiast rybki (patrz komentarz w resourcepack.yml jak wgrac nowa paczke).
