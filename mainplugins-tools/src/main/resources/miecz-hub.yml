# ==========================================================================
# miecz-hub.yml - uklad menu "Miecz - Umiejetnosci" (Shift + PPM miecz).
# Model kart (roguelike level-up) - nie ma juz przegladania galezi, wiec uklad
# jest prostszy niz kiedys. Mozna zmienic tu rozmiar okna oraz pozycje (sloty)
# kazdej ikonki bez przebudowy pluginu, wystarczy zmienic plik i zrestartowac
# serwer.
#
# rozmiar: liczba slotow. Musi byc wielokrotnoscia 9 w zakresie 9-54 - inna
# wartosc zostanie zaokraglona w gore do najblizszej wielokrotnosci 9 i
# przycieta do 54.
#
# sloty: numeracja od 0 (lewy gorny rog) do rozmiar-1 (prawy dolny rog),
# rzedami po 9. Kazdy slot powinien byc unikalny.
#
# wybor_karty - centralny przycisk: swieci, gdy czeka oferta 4 kart do wyboru
# (po kazdym levelu).
# ==========================================================================

rozmiar: 27

sloty:
  narzedzie: 4
  wybor_karty: 13
  statystyki: 20
  wyjdz: 22
  ulepszenia: 24