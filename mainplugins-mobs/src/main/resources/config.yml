# Moby testowe - statystyki i umiejętności każdego moba (id jak w Kreatorze mobów).
# Mob bez wpisu tutaj ma statystyki zwykłego zombie i żadnych umiejętności.
#
# Umiejętności: mob używa jednej naraz, gdy ma cel (gracza) w podanym zasięgu (kratki).
# "co-ile-sekund" - odstęp między użyciami tej samej umiejętności.
# "animacja" - nazwa animacji z Kreatora mobów, która gra w trakcie.
# "moment" - sekunda animacji, w której dzieje się akcja (np. lecą igły).
# "kosc" - część moba (id kości z Kreatora), z której coś wylatuje.
# "dzwiek" - dźwięk z gry (np. entity.witch.throw), puste = bez dźwięku.
#
# Typy umiejętności:
#   skok-na-gracza - doskok do gracza, lądowanie rani i odrzuca
#   rzut-iglami    - mob staje i rzuca w gracza igłami
#   ptaki          - mob wypuszcza ptaki, które lecą na gracza i go dziobią
#   wielki-skok    - skok wysoko w górę, upadek (kurz, obrażenia wokół), mob siedzi oszołomiony
#                    tak długo, jak trwa "animacja-upadku", potem wstaje
#
# Ruch "żywy" i wygląd (każdy mob, domyślnie włączone):
#   patrzenie: true          - głowa (i szyja) obraca się do celu / najbliższego gracza
#   stopy-na-terenie: true   - nogi (części z "leg" w nazwie, z kolanem) dopasowują się do schodków i zboczy
#   sprezyny: true           - ogon, uszy, peleryna, macki (po nazwach) reagują na prawdziwy ruch moba
#   hitboxy-czesci: true     - każda duża część ma własny obszar trafienia (duże moby: trafiasz w to, co widzisz)
#   slabe-punkty: {head: 2}  - mnożnik obrażeń za trafienie w część (nazwa z Kreatora); głowa domyślnie 1,5
#   rozpad: true             - po animacji "death" części rozpadają się i spadają na ziemię
#   animacje-w-tle: [...]    - pętle grane stale (np. orbita); bez listy - pętle poza stanami (bieg, lot, sen...)
#   animacje-losowe: [...]   - co jakiś czas, gdy mob stoi bez celu, gra jedną z nich (co-ile-sekund-losowe: 14)
#   faza-2: {ponizej-zycia: 0.5, animacja: ..., wariant: ..., obrazenia-mnoznik: 1.5, dzwiek: ...}
#                            - poniżej części życia: animacja wejścia, zmiana wyglądu (wariant z Kreatora), mocniejsze ciosy
# Animacja "run" (jeśli jest) gra sama przy szybkim marszu, płynnie z "walk".
moby:
  burzowy_gryf:
    zycie: 60
    szybkosc: 0.3
    obrazenia: 6
    odpornosc-na-odrzut: 0.4
    slabe-punkty:
      head: 2.0
    animacje-losowe: [preen, shake, screech]
    faza-2:
      ponizej-zycia: 0.5
      animacja: charge
      wariant: burza
      obrazenia-mnoznik: 1.5
      dzwiek: entity.lightning_bolt.thunder
    umiejetnosci:
      skok:
        typ: skok-na-gracza
        animacja: jump
        co-ile-sekund: 7
        zasieg-od: 4
        zasieg-do: 12
        obrazenia: 7
        wybicie: 0.3
        ladowanie: 1.1
        dzwiek: entity.phantom.bite
      nurkowanie:
        typ: wielki-skok
        animacja: takeoff
        animacja-upadku: land
        co-ile-sekund: 18
        zasieg-od: 5
        zasieg-do: 16
        wybicie: 0.55
        czas-lotu: 1.4
        wysokosc: 9
        zasieg-uderzenia: 4
        obrazenia: 9
        dzwiek: entity.generic.explode
        dzwiek-oszolomienia: entity.parrot.hurt

  bagienny_mutant:
    zycie: 40
    szybkosc: 0.25
    obrazenia: 4
    umiejetnosci:
      skok:
        typ: skok-na-gracza
        animacja: jump
        co-ile-sekund: 6
        zasieg-od: 4
        zasieg-do: 12
        obrazenia: 6
        wybicie: 0.25
        ladowanie: 1.25
        dzwiek: entity.slime.squish

  drzewiec:
    zycie: 150
    szybkosc: 0.33
    obrazenia: 9
    odpornosc-na-odrzut: 0.8
    umiejetnosci:
      igly:
        typ: rzut-iglami
        animacja: rzut
        co-ile-sekund: 7
        zasieg-od: 5
        zasieg-do: 20
        ile: 6
        obrazenia: 3
        moment: 0.45
        kosc: b_arm_r
        dzwiek: entity.witch.throw
      ptaki:
        typ: ptaki
        animacja: ptaki
        co-ile-sekund: 16
        zasieg-od: 0
        zasieg-do: 20
        ile: 3
        obrazenia: 2
        czas-zycia: 12
        moment: 0.4
        kosc: b_hollow
        dzwiek: entity.parrot.imitate.ravager
      wielki-skok:
        typ: wielki-skok
        animacja: skok
        animacja-upadku: upadek
        co-ile-sekund: 20
        zasieg-od: 3
        zasieg-do: 14
        wybicie: 0.35
        czas-lotu: 1.5
        wysokosc: 7
        zasieg-uderzenia: 5
        obrazenia: 8
        dzwiek: entity.generic.explode
        dzwiek-oszolomienia: entity.ravager.stunned
