# Mainplugins Shop - settings. Items and prices are in categories/<id>.yml (one file per category).
# Texts (titles, buttons, messages) are in lang/en.yml and lang/pl.yml.
# Reload without restart: /@shop reload

# Order of categories in the main menu (file names from categories/ without .yml).
categories: [blocks, farming, ores, mob-drops, food]

# How prices are rounded when a player buys part of a pack or when dynamic prices change them:
#   whole = whole coins (1 piece of a "64 for 10" pack costs 1)
#   cents = cents (1 piece of a "64 for 10" pack costs 0.16)
price-rounding: cents

# Sell prices react to what players sell: lots of selling -> the price drops, nobody sells -> it rises.
dynamic-prices:
  enabled: true
  cycle-minutes: 60        # how often prices are recalculated
  min-multiplier: 0.5      # lowest sell price = 50% of the normal one
  max-multiplier: 1.5      # highest sell price = 150% of the normal one
  reset-days: 14           # every N days all prices go back to normal
  max-sell-share: 0.9      # selling never pays more than 90% of the buy price
  announce-events: true    # tell everyone on chat when an event (/@shop event) starts or ends
  announce-reset: true     # tell everyone on chat when all prices go back to normal (every reset-days)
  # Tuning - the defaults are deliberate, change them only if you know what you are doing.
  tuning:
    max-drop-per-cycle: 0.05   # biggest sell-price drop in one cycle at the normal price (0.05 = 5%)
    drop-at-top: 4.2           # how much stronger the drop is when the price sits at the maximum
    recover-from-below: 0.8    # how much of the way back to normal is recovered in one quiet cycle
    rise-per-cycle: 0.125      # how much the price rises per cycle while nobody sells the item
    quiet-threshold: 0.1       # selling below this share of the norm counts as quiet
    cycles-to-rise: 2          # quiet cycles before the price starts rising above normal
    cycles-frozen: 2           # cycles the price stays at normal after coming down from the top
    norm-learn-rate: 0.02      # how fast the shop forgets old cycles (0.02 = about a week of history)

# Sales statistics (stats.yml + stats.csv for Excel) with hints which prices to change.
stats:
  enabled: false

# Where things are in each window. size = 9, 18, 27, 36, 45 or 54.
# Roles: CATEGORY_SLOT (main menu), ITEM_SLOT, ROTATION_SLOT (place for a rotating item), AMOUNT_SLOT (buy-picker, amount = pieces),
