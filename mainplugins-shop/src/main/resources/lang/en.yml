# Mainplugins Shop - English messages. Colors: &a &e ...  Placeholders in {braces}.
# {item} is shown in the player's own game language.
menu:
  main-title: "&1&lServer Shop"
  category-title: "&2&l{category}"
  picker-title: "&8&lHow many?"
  search-title: "&3&lResults: {query}"
  category-hint: "&7Click to open the category!"
  search: "&b&lSearch for an item"
  search-hint-1: "&fClick and type the name in chat"
  search-hint-2: "&7e.g. cobblestone, diamond, cactus"
  exit-close: "&c&lClose the shop"
  exit-menu: "&c&lBack to the main menu"
  prev: "&e&lPrevious page"
  next: "&e&lNext page"
  page: "&7Page {page} / {pages}"
  back-categories: "&6&lBack to categories"
  back-shop: "&6&lBack to the shop"
  back-picker: "&7Back"
  sort: "&b&lSorting"
  sort-now-buy: "&fNow: cheapest to buy first"
  sort-now-sell: "&fNow: highest sell price first"
  sort-lmb: "LMB - cheapest to buy first"
  sort-rmb: "RMB - highest sell price first"
item:
  buy: "&aBuy: {price}$ per piece"
  sell: "&bSell: {price}$ for {amount} pcs"
  trend-up: "  &a▲"
  trend-down: "  &c▼"
  event: "  &d★ EVENT"
  event-timed: "  &d★ EVENT &7({time})"
  lmb-buy: "&eLMB - buy"
  cannot-buy: "&8This cannot be bought"
  rmb-sell: "&eRMB - sell one stack (by {amount} pcs)"
  shift-rmb-sell: "&eShift+RMB - sell everything from your inventory"
  cannot-sell: "&8This cannot be sold"
  rotating: "&d&lLIMITED OFFER &7- changes in {days} d."
  category: "&8Category: {category}"
picker:
  amount-ok: "&a&l{amount} pcs"
  amount-no: "&c&l{amount} pcs"
  price: "&6Price: {price}$"
  per-piece: "&8({price}$ per piece when buying 1)"
  click: "&eLMB - click to buy"
  no-money: "&cNot enough money"
  shift: "&eShift+LMB - buy the maximum (money + inventory space)"
buy:
  bought: "&aBought {amount}x {item} for {price}$!"
  no-money: "&cYou can't afford it! You need {price}$."
  no-space: "&cYou don't have that much space in your inventory!"
  no-space-any: "&cYou have no space in your inventory!"
  cannot-afford-one: "&cYou can't afford even one piece!"
  cannot-buy: "&cThis item cannot be bought!"
  unavailable: "&cThis item is not available right now."
  gone: "&cThe shop has changed - open it again."
sell:
  empty-hand: "&cYou are not holding anything!"
  empty-hand-all: "&cHold the item you want to sell in bulk!"
  cannot-sell: "&cThis item cannot be sold in the shop!"
  nothing: "&cYou have nothing to sell!"
  not-enough: "&cThe shop buys this item by {amount} pcs - you have {have}."
  sold: "&bSold {amount}x {item} for {price}$!"
  rest: "&7 ({rest} pcs left - not enough for another pack)"
search:
  prompt: "&bType in chat what you are looking for."
  cancel-hint: "&7Type \"cancel\" to give up."
  cancel-word: "cancel"
  cancelled: "&7Cancelled."
  none: "&cNothing found for: {query}"
  found: "&bFound: {count}"
  found-cut: "&bFound: {count} (showing the first {shown})"
dynamic:
  reset-broadcast: "&6Shop prices are back to normal!"
hud:
  event-info: "&d&lEVENT &7- {count} item(s) on sale!"
  trend-up: "&a▲ &f{item} &7is getting more expensive &7(+{percent}%)"
  trend-down: "&c▼ &f{item} &7is getting cheaper &7({percent}%)"
event:
  broadcast-up: "&d&l★ EVENT! &7The shop pays &a{percent}% &7more for &f{item}&7! &8(/shop)"
  broadcast-up-timed: "&d&l★ EVENT! &7The shop pays &a{percent}% &7more for &f{item} &7for &f{time}&7! &8(/shop)"
  broadcast-down: "&d&l★ EVENT! &7The shop pays &c{percent}% &7less for &f{item}&7! &8(/shop)"
  broadcast-down-timed: "&d&l★ EVENT! &7The shop pays &c{percent}% &7less for &f{item} &7for &f{time}&7! &8(/shop)"
  broadcast-off: "&7The event on &f{item} &7is over - the sell price is back to normal."
  broadcast-all-off: "&d&l★ Events are over! &7All sell prices are back to normal."
rotation:
  broadcast-header: "&d&l★ NEW OFFER: {category} ★"
  broadcast-item: "&8  • &f{item}  &6{price}$ &7for {amount} pcs"
  broadcast-footer: "&7Check /shop - the offer is gone in {days} days!"
admin:
  usage:
    - "&6&l=== /@shop ==="
    - "&e/@shop reload &7- read shop.yml and categories again"
    - "&e/@shop info <item> &7- prices and market state of an item"
    - "&e/@shop price <item> buy|sell <amount> &7- change the price OF THE WHOLE PACK (asks to confirm)"
    - "&e/@shop reset <item> &7- sell price back to normal"
    - "&e/@shop resetall &7- all sell prices back to normal"
    - "&e/@shop multiplier <item> <+50|-20> &7- change the sell price by that many percent"
    - "&e/@shop event <item> <+50|-20> [30m|2h|3d] &7- sell-price event (no time = until off)"
    - "&e/@shop event <item> off &8/ &elist &8/ &eoffall &7- end one / show running / end them all"
    - "&e/@shop rotation [force [category]] &7- rotating categories"
    - "&e/@shop stats [snapshot] &7- today's sales"
  players-only: "&cOnly a player can use the shop."
  reloaded: "&aShop reloaded: {categories} categories, {items} items."
  unknown-item: "&cNo such item in the shop: {item} (use the name from tab, e.g. DIAMOND or custom:my_item)"
  not-a-number: "&cThat is not a number: {value}"
  price-positive: "&cThe amount must be above zero."
  price-type: "&cUse 'buy' or 'sell'."
  price-margin: "&cREJECTED: selling ({sell}$ per piece) would pay at least as much as buying ({buy}$ per piece)."
  price-set: "&aChanged {type} of {item} to {amount}$ for {pieces} pcs ({each}$ per piece) - saved in categories/{category}.yml, shop reloaded."
  price-multiplier-note: "&7Note: the sell price of this item is currently changed by {percent}%, so the real price is different. /@shop reset {item} brings it back."
  price-failed: "&cCould not save the category file: {error}"
  confirm-price-buy:
    - "&6&lBUY price change: &f{item}"
    - "&7Now: &f{old}$ &7for &f{pieces} pcs &7= &f{old-each}$ &7per piece"
    - "&7After: &a{new}$ &7for &f{pieces} pcs &7= &a{new-each}$ &7per piece"
    - "&eAre you sure? Type &f/@shop confirm &e(within {seconds} s) or &f/@shop cancel"
  confirm-price-sell:
    - "&6&lSELL price change: &f{item}"
    - "&7Now: &f{old}$ &7for &f{pieces} pcs &7= &f{old-each}$ &7per piece"
    - "&7After: &a{new}$ &7for &f{pieces} pcs &7= &a{new-each}$ &7per piece"
    - "&eAre you sure? Type &f/@shop confirm &e(within {seconds} s) or &f/@shop cancel"
  confirm-reset: "&eReset the sell price of &f{item}&e to normal (now changed by {percent}%)? Type /@shop confirm within {seconds} s."
  confirm-resetall: "&cThis resets the sell prices of ALL {count} items (events too). Type /@shop confirm within {seconds} s."
  confirm-nothing: "&cThere is nothing to confirm."
  confirm-expired: "&cThe confirmation expired - type the command again."
  cancelled: "&7Cancelled."
  reset-done: "&aThe sell price of {item} is back to normal."
  resetall-done: "&aAll sell prices are back to normal."
  multiplier-set: "&aSell price of {item} changed by {percent}%."
  percent-range: "&cThe percent must be between {min}% and {max}%."
  not-a-percent: "&cThat is not a percent: {value} (use e.g. +50, -20 or 50%)"
  not-a-duration: "&cBad duration: {value} (use e.g. 30m, 2h or 3d)"
  event-set: "&aEVENT: sell price of {item} changed by {percent}% - no end. End it: /@shop event {item} off"
  event-set-timed: "&aEVENT: sell price of {item} changed by {percent}% for {time}. End it sooner: /@shop event {item} off"
  event-off: "&aEvent of {item} ended - the price is back to normal and changes by itself again."
  event-not-locked: "&c{item} has no event right now."
  event-list-header: "&6&lRunning events:"
  event-list-line: "&e  {item} &b{percent}% &7- no end"
  event-list-line-timed: "&e  {item} &b{percent}% &7- {time} left"
  event-list-empty: "&7No item has an event right now."
  event-offall: "&aEnded all events ({count}) - sell prices are back to normal."
  dynamic-off: "&7Dynamic prices are turned off in shop.yml."
  info:
    - "&6&l=== {item} ==="
    - "&7Category: {category}"
    - "&7Buy: {buy}"
    - "&7Sell: {sell}"
    - "&bReal sell price now: {real}"
    - "&7Sell price changed by: {percent}% {state}"
    - "&7Normal sales: {norm} pcs per cycle, quiet for {drought} cycles"
    - "&7Days to the global price reset: {days}"
  info-none: "none"
  info-per: "{price}$ for {amount} pcs"
  info-locked: "&d(locked - event)"
  info-up: "(raised)"
  info-down: "(lowered)"
  info-normal: "(normal)"
  rotation-none: "&7No category has rotation turned on."
  rotation-header: "&6&lRotation: {category} &7- next change in {days} d., pool {pool}, resting {resting}"
  rotation-line: "&7  - {item} ({price}$)"
  rotation-forced: "&aDrew a new offer in {count} categor(ies)."
  stats-disabled: "&cStatistics are turned off. Turn them on in the app (Shop -> Settings -> Statistics) or in shop.yml (stats.enabled: true), then /@shop reload."
  stats-snapshot: "&aSnapshot saved to stats-archive/."
  stats-header: "&6&l=== Sales today ==="
  stats-line: "&7{nr}. &e{item}  &f{amount} pcs  &b{money}${trend}"
  stats-empty: "&7Nothing was sold today yet."
  stats-total: "&7Paid out today: &6{money}$"
