name: MainpluginsSpawners
version: ${project.version}
main: elo.mainplugins.spawners.MainpluginsSpawners
api-version: '1.20'
depend: [MainpluginsCore]
softdepend: [MainpluginsSkyblock, MainpluginsMobs]

commands:
  spawnery:
    description: Spawner upgrades - more mobs at once or more often
    usage: /<command>
    aliases: [spawners]
  "@spawner":
    description: (Admin) Spawners - give a spawner, list types, info about the one you look at, reload
    usage: /<command> give <player> <type> [amount] | list | info | reload
    permission: mainplugins.spawners.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@reloadspawnery":
    description: Wczytaj spawnery-typy.yml na nowo, bez restartu serwera
    permission: mainplugins.spawners.reload
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.spawners.admin:
    description: Give spawners, see spawner info, pick up any spawner
    default: op
  mainplugins.spawners.reload:
    description: Pozwala przeładować typy i ustawienia customowych spawnerów
    default: op
