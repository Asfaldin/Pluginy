# Mainplugins Skyblock - English messages. Colors: &a &e ...  Placeholders: {name}
# Amounts ({amount}, {balance}, {cost}, {worth}) already include the server currency (e.g. "100$").
template:
  missing: "&cIslands are not set up yet - an admin has to save an island template first (/@islandtemplate)."
  usage: "&eUsage: /@islandtemplate rozdzka | pos1 | pos2 | save [name] &7- with the wand left-click one corner of the island and right-click the opposite one (or pos1/pos2 where you fly), then stand where players should appear and use save. Without a name it saves the 'default' template."
  pos-set: "&aCorner {n} set to {x} {y} {z}."
  need-corners: "&cSelect both corners first: with the wand (/@islandtemplate rozdzka) or /@islandtemplate pos1 and pos2."
  wand-given: "&aYou got the island template wand: left-click a block = corner 1, right-click = corner 2."
  wand-name: "&6&lIsland Template Wand"
  wand-lore-1: "&7Left-click a block - corner 1"
  wand-lore-2: "&7Right-click a block - corner 2"
  wand-lore-3: "&8Then: /@islandtemplate save <name>"
  selected: "&aSelected {sx}x{sy}x{sz} blocks. Stand where players should appear and type /@islandtemplate save <name>."
  other-world: "&cBoth corners and you must be in the same world."
  saved: "&aIsland template '{id}' saved ({sx}x{sy}x{sz} blocks). New islands will use it."
  save-failed: "&cCould not save the island template - see the server log."

common:
  no-island: "&cYou don't have an island!"
  no-island-yet: "&cYou don't have an island yet!"
  island-missing: "&cYour island does not exist!"
  managers-only: "&cOnly the island owner and admins can do that!"
  player-not-found: "&cNo online player with that name."
  not-member: "&cThat player is not a member of your island."
  players-only: "&cOnly a player can use this command."
  reloaded: "&aIsland configuration and GUI layout reloaded."
  teleported: "&bTeleported to your island!"
