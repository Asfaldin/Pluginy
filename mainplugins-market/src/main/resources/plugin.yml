name: MainpluginsMarket
version: ${project.version}
main: elo.mainplugins.market.MainpluginsMarket
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  targ:
    description: Player market - open it or list the item in your hand
    usage: /<command> [sell <price>]
  "@market":
    description: (Admin) Market - reload settings, list or remove a player's offers
    usage: /<command> reload | list <player> | remove <player> | remove-offer <id>
    permission: mainplugins.market.admin
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.market.admin:
    description: Access to /@market
    default: op
