name: MainpluginsShop
version: ${project.version}
main: elo.mainplugins.shop.MainpluginsShop
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  sklep:
    description: Server shop
    aliases: [buy]
  sprzedaj:
    description: Sell the item in your hand
    aliases: [sell]
  sprzedajwszystko:
    description: Sell all items of the type in your hand
    aliases: [sellall]
  "@shop":
    description: (Admin) Shop - reload, prices, dynamic prices, events, rotation, statistics
    usage: /<command> reload | info | price | reset | resetall | multiplier | event | rotation | stats
    permission: mainplugins.shop.admin
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.shop.admin:
    description: Access to /@shop
    default: op
