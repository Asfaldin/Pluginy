# Skrzynki - każda skrzynka, jej wygląd, klucze, które ją otwierają, i co można wygrać.
# Edytuj w aplikacji (strona "Skrzynki") albo tutaj, potem /@crate reload.
#   item / icon: { item: MATERIAŁ } albo { custom: ID_Z_KATALOGU_PRZEDMIOTÓW }, opcjonalnie amount
#   keys: które klucze otwierają skrzynkę (jeden klucz może otwierać kilka skrzynek)
#   prizes: weight = szansa (weight / suma wag), rewards = co gracz dostaje
#           (money, item, custom, command, crate, key ... - ten sam zapis co wszędzie)
#   hologram: (opcjonalnie) linijki nad skrzynką postawioną w świecie przez /@crate place;
#             bez tego: nazwa skrzynki + podpowiedź z lang/<język>.yml (placed.hint)
#   hologram-enabled: false  -> brak napisu nad tą skrzynką
settings:
  hologram-height: 0.6   # ile bloków nad postawioną skrzynką wisi napis
  placed-block-from-item: true   # postawiony blok przyjmuje wygląd przedmiotu skrzynki (jeśli to blok)
  # Okno otwierania: "ruletka" nagród. enabled: false = bez animacji, nagroda od razu.
  animation:
    enabled: true
    speed: normal   # fast | normal | slow
    background: BLACK_STAINED_GLASS_PANE
    pointer: YELLOW_STAINED_GLASS_PANE   # dwie strzałki nad i pod wygraną
    tick-sound: ui.button.click   # dźwięk z Minecrafta, "" = cicho
    win-sound: entity.player.levelup
keys:
  basic_key:
    name: "&e&lKlucz do Tajemniczej Skrzynki"
    item: { item: TRIPWIRE_HOOK }
    lore: ["&7Otwiera Tajemniczą Skrzynkę."]
  abyss_key:
    name: "&d&lKlucz do Skrzynki Otchłani"
    item: { item: TRIPWIRE_HOOK }
    lore: ["&7Otwiera Skrzynkę Otchłani."]
  darkstar_key:
    name: "&b&lKlucz do Skrzynki DARKSTAR"
    item: { item: TRIPWIRE_HOOK }
    lore: ["&7Otwiera Skrzynkę DARKSTAR."]
  universal_key:
    name: "&6&lKlucz Uniwersalny"
    item: { item: TRIPWIRE_HOOK }
    lore: ["&7Otwiera każdą skrzynkę."]

