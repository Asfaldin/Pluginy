name: MainpluginsQuests
version: ${project.version}
main: elo.mainplugins.quests.MainpluginsQuests
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  zadania:
    description: Quests menu
    aliases: [quest]
  "@quests":
    description: (Admin) Quests - reload, list, reset, complete or undo a player's quests
    usage: /<command> reload | list | reset <player> [category] | complete <player> <category> <quest> | undo <player> <category> <quest>
    permission: mainplugins.quests.admin
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.quests.admin:
    description: Access to /@quests
    default: op
