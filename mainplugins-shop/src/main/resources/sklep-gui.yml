# ==========================================================================
# Uklad i rozmiar GUI sklepu (menu glowne, strona kategorii, wybor ilosci,
# wyniki wyszukiwania). Zero hardkodowanych tablic slotow w Javie - caly
# uklad zyje TUTAJ. Tresc sklepu (ceny, itemy, kategorie) jest OSOBNO w
# sklep.yml + categories/*.yml - ten plik odpowiada wylacznie za to, GDZIE
# w oknie GUI co sie renderuje.
#
# Przeladowanie na zywo, razem z reszta sklepu: /@reloadsklep
#
# category-order: kolejnosc kategorii - sluzy DWA razy: (1) w jakiej
#   kolejnosci kopiowac domyslne pliki categories/*.yml przy pierwszym
#   starcie serwera, (2) i-ty CATEGORY_SLOT w main-menu.layout -> i-ta
#   pozycja z tej listy. Kategoria z plikiem na dysku, ale spoza tej listy,
#   nadal dziala (mozna ja kupowac/sprzedawac) - po prostu nie ma wlasnej
#   ikony w menu glownym.
#
# Kazdy ekran (main-menu / category-page / buy-picker / search-results) ma:
#   size   - rozmiar okna, wielokrotnosc 9, zakres 9-54.
#   layout - lista {slot: 0-(size-1), role: ..., material?, amount?}.
#            Slot spoza listy = domyslny wypelniacz (szare szklo).
#
# role:
#   CATEGORY_SLOT - tylko main-menu. Kolejnosc wpisow w liscie = kolejnosc
#                   przypisania do category-order (i-ty CATEGORY_SLOT -> i-ta
#                   kategoria z listy).
#   ITEM_SLOT     - category-page/search-results. Kolejnosc = kolejnosc
#                   wypelniania (i strony, dla category-page).
#   AMOUNT_SLOT   - tylko buy-picker. WYMAGA pola "amount" (ile sztuk
#                   reprezentuje ta opcja) - to jest "ile kratek na ile
#                   mozna dac" z tego ekranu.
#   NAV_BACK / NAV_PREV / NAV_NEXT / EXIT / SEARCH / SORT - przyciski, tekst
#                   i kolor etykiety sa w sekcji "styl" ponizej, tu tylko POZYCJA.
#   FILLER        - jawny wypelniacz z wlasnym materialem (opcjonalne pole
#                   "material") - bez tego pola dziala jak zwykly pusty slot.
#
# styl: kolory tytulow okien + tekst/kolor przyciskow nawigacyjnych.
#   styl.tytuly.*     - nazwa NamedTextColor (np. RED, DARK_GREEN, LIGHT_PURPLE).
#                       Tytuly kategorii/wyboru ilosci/wynikow szukania maja czesc
#                       tekstu DYNAMICZNA (nazwa kategorii/itemu/fraza) - dlatego
#                       tylko kolor jest tu edytowalny, nie caly tekst.
#   styl.przyciski.*  - { tekst: "...", kolor: NAZWA_KOLORU }, oba pola opcjonalne
#                       (brak = domyslna wartosc jak dawniej w kodzie).
# Statyczny opis pod ikonami kategorii ("Kliknij, aby otworzyc kategorie!") i kolor
# dynamicznych linii ceny/trendu (Kupno/Skup/▲▼/EVENT) w lore itemow NIE sa tutaj -
# to swiadomie zostalo w Javie.
# ==========================================================================

