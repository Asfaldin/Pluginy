name: MainpluginsAdvancements
version: ${project.version}
main: elo.mainplugins.advancements.MainpluginsAdvancements
api-version: '1.20'
depend: [MainpluginsCore]
softdepend: [MainpluginsCrates, MainpluginsRanks, MainpluginsQuests, MainpluginsMenu]

commands:
  osiagniecia:
    description: Otwiera panel osiągnięć - postęp vanilla advancementów, własne osiągnięcia i odbieranie nagród
    usage: /<command>
    aliases: [achievements, ach, osiag]
  resetzadania:
    description: Zeruje Twój postęp osiągnięć (można wszystko zrobić od nowa); z argumentem <gracz> dla adminów
    usage: /<command> [gracz]
    aliases: [resetosiagniecia, resetachievements]
  "@reloadosiagniecia":
    description: (Admin) Wczytaj osiagniecia.yml na nowo, bez restartu serwera
    permission: mainplugins.advancements.reload
    permission-message: "&cNie masz permisji do tej komendy!"
  "@osiagniecia":
    description: (Admin) Zarządzanie osiągnięciami gracza - podgląd / oznacz jako zdobyte / wyczyść
    usage: "/<command> <info|grant|reset> <gracz> [id]"
    permission: mainplugins.advancements.admin
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.advancements.reload:
    description: Pozwala przeładować osiagniecia.yml
    default: op
  mainplugins.advancements.admin:
    description: Pozwala ręcznie nadawać / resetować osiągnięcia graczy
    default: op
