name: MainpluginsCore
version: ${project.version}
main: elo.mainplugins.core.MainpluginsCore
api-version: '1.20'

commands:
  wszystkiekomendy:
    description: Panel administratora - moduły, statystyki i wszystkie komendy
    permission: mainplugins.core.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  komendy:
    description: Lista komend dla gracza (strona 1/4)
    aliases: [pomoc, help]
  komendy2:
    description: Lista komend dla gracza (strona 2/4)
  komendy3:
    description: Lista komend dla gracza (strona 3/4)
  komendy4:
    description: Lista komend dla gracza (strona 4/4)
  "@komendy":
    description: Lista komend dla admina (strona 1/3)
    permission: mainplugins.core.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@komendy2":
    description: Lista komend dla admina (strona 2/3)
    permission: mainplugins.core.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@komendy3":
    description: Lista komend dla admina (strona 3/3)
    permission: mainplugins.core.admin
    permission-message: "&cNie masz permisji do tej komendy!"
  "@moneyadd":
    description: "[TEST] Dodaj kasę graczowi"
    permission: mainplugins.core.moneyadd
    permission-message: "&cNie masz permisji do tej komendy!"
    usage: /<command> [gracz] <kwota>
  "@moneyundo":
    description: "[TEST] Wyzeruj kasę graczowi"
    permission: mainplugins.core.moneyadd
    permission-message: "&cNie masz permisji do tej komendy!"
    usage: /<command> [gracz]
  przelej:
    description: Przelej pieniądze innemu graczowi
    usage: /<command> <gracz> <kwota>
    aliases: [pay]
  portfel:
    description: Sprawdź ile masz pieniędzy
    aliases: [p, money]
  discord:
    description: Wyślij link zaproszenia na Discorda serwera
  "@dajcustom":
    description: (Admin) Wydaj/testuj custom item z rejestru (custom-items.yml)
    permission: mainplugins.core.dajcustom
    permission-message: "&cNie masz permisji do tej komendy!"
    usage: /<command> <id> [gracz] [ilość]
  "@reloadcustomitems":
    description: Wczytaj custom-items.yml na nowo, bez restartu serwera
    permission: mainplugins.core.reloadcustomitems
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.core.admin:
    description: Dostęp do /wszystkiekomendy i /@komendy
    default: op
  mainplugins.core.moneyadd:
    description: Dostęp do testowego doładowania/zerowania ekonomii
    default: op
  mainplugins.core.dajcustom:
    description: Dostęp do wydawania custom itemów z rejestru
    default: op
  mainplugins.core.reloadcustomitems:
    description: Dostęp do przeładowania custom-items.yml
    default: op
