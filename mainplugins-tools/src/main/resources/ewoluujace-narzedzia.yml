          szansa-bazowa: 10
          szansa-na-poziom: 0.4
          szansa-max: 30
          kwota-bazowa: 2
          kwota-na-poziom: 0.1
      15:
        - typ: AURA_MIKSTURY
          mikstura: fast_digging
          poziom-mikstury: 0
      18:
        - typ: TELEKINEZA
          szansa-bazowa: 15
          szansa-na-poziom: 0.5
          szansa-max: 40
      19:
        - typ: PIORUN
          szansa-bazowa: 0.5
          szansa-na-poziom: 0.03
          szansa-max: 2
      21:
        - typ: MAGNES
          szansa-bazowa: 100
          promien: 6
      24:
        - typ: BONUS_PRZEDMIOT
          szansa-bazowa: 3
          szansa-na-poziom: 0.1
          szansa-max: 8
          przedmiot-custom-id: TROFEUM_GLOWA_GORNIKA
          kwota-bazowa: 1
      27:
        - typ: ZYLA_GORNICZA
          szansa-bazowa: 2
          szansa-na-poziom: 0.1
          szansa-max: 6
          kwota-bazowa: 8
          kwota-na-poziom: 0.5
        - typ: PVP_BONUS_OBRAZENIA
          kwota-bazowa: 1
      30:
        - typ: JACKPOT
          szansa-bazowa: 0.5
          kwota-bazowa: 200
          kwota-na-poziom: 10
        - typ: BONUS_PIENIADZE
          szansa-bazowa: 15
          kwota-bazowa: 3
          kwota-na-poziom: 0.2
        - typ: SPECJALNY_SILK_TOUCH
    pasywne:
      - typ: BONUS_XP
        szansa-bazowa: 3
        szansa-na-poziom: 0.2
        szansa-max: 10
        kwota-bazowa: 2

  SIEKIERA_START:
