name: MainpluginsMenu
version: ${project.version}
main: elo.mainplugins.menu.MainpluginsMenu
api-version: '1.20'
depend: [MainpluginsCore]

commands:
  menu:
    description: Main server menu
  "@reloadmenu":
    description: (Admin) Reload menu.yml without a restart
    permission: mainplugins.menu.reload
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.menu.reload:
    description: Reload the main menu layout
    default: op
