# Mainplugins Skyblock - English messages. Colors: &a &e ...  Placeholders: {name}
# Amounts ({amount}, {balance}, {cost}, {worth}) already include the server currency (e.g. "100$").
template:
  missing: "&cIslands are not set up yet - an admin has to save an island template first (/@islandtemplate)."
  usage: "&eUsage: /@islandtemplate pos1 | pos2 | save &7- fly to two opposite corners around the island for pos1/pos2, then stand where players should appear and use save."
  pos-set: "&aCorner {n} set to {x} {y} {z}."
  need-corners: "&cSet both corners first: /@islandtemplate pos1 and /@islandtemplate pos2."
  other-world: "&cBoth corners and you must be in the same world."
  saved: "&aIsland template saved ({sx}x{sy}x{sz} blocks). New islands will use it."
  save-failed: "&cCould not save the island template - see the server log."

common:
  no-island: "&cYou don't have an island!"
  no-island-yet: "&cYou don't have an island yet!"
  island-missing: "&cYour island does not exist!"
  managers-only: "&cOnly the island owner and admins can do that!"
  player-not-found: "&cNo online player with that name."
  not-member: "&cThat player is not a member of your island."
  players-only: "&cOnly a player can use this command."
  reloaded: "&aIsland configuration and GUI layout reloaded."
  teleported: "&bTeleported to your island!"
  # Word a player types to cancel a chat prompt (invite, island name).
  cancel-word: "cancel"

create:
  cooldown: "&cYou have to wait {time} before creating another island."
  creating: "&eCreating your island..."
  error: "&cSomething went wrong while generating the island!"
  done: "&aYour island has been created!"

delete:
  warning: "&c&lWARNING: Do you really want to delete your island? This cannot be undone!"
  how-to-confirm: "&eType \"{phrase}\" in chat within {seconds} s to confirm (anything else cancels)."
  # Sentence a player must type to delete the island (case does not matter).
  confirm-phrase: "Yes I agree"
  owner-only: "&cOnly the owner can delete the island!"
  cancelled: "&eIsland deletion cancelled."
  done: "&cYour island has been permanently deleted."
  member-notice: "&cThe island you were on has been deleted by its owner."

settings:
  border-on: "&aVisual border: on"
  border-off: "&aVisual border: off"
  build-on: "&aBuilding for guests: open"
  build-off: "&aBuilding for guests: closed"
  pvp-on: "&aPvP on the island: on"
  pvp-off: "&aPvP on the island: off"
  mobs-on: "&aMonsters on the island: can spawn"
  mobs-off: "&aMonsters on the island: blocked"
  guest-kill-on: "&aGuests killing mobs: allowed"
  guest-kill-off: "&aGuests killing mobs: blocked"
  pickup-on: "&aGuests picking up items: allowed"
  pickup-off: "&aGuests picking up items: blocked"
  containers-on: "&aGuest access to chests/containers: allowed"
  containers-off: "&aGuest access to chests/containers: blocked"
  interact-on: "&aDoors/levers/buttons for guests: allowed"
  interact-off: "&aDoors/levers/buttons for guests: blocked"
  weather-on: "&aWeather and time on the island: locked (always noon, clear)"
  weather-off: "&aWeather and time on the island: natural"

home:
  not-on-island: "&cYou have to stand on your own island to set a teleport point here!"
  home-set: "&aNew teleport point (/home) set on your island!"
  spawn-set: "&aNew teleport point (/is) set on your island!"

invite:
  usage: "&cUsage: /is invite <player>"
  self: "&cYou cannot invite yourself!"
  has-island: "&cThat player already has an island or is a member of another one."
  already-pending: "&cThat player already has a pending invite."
  expired: "&7The island invite has expired."
  sent: "&aInvite sent to {player}."
  received: "&bYou have been invited to {player}'s island! Type /is accept or /is deny within {seconds} s."
  none: "&cYou have no pending invites."
  outdated: "&cYou already have an island - this invite is no longer valid."
  island-gone: "&cThat island no longer exists."
  joined: "&aYou joined the island!"
  accepted-notice: "&a{player} accepted the invite and joined the island!"
  declined: "&eInvite declined."
  declined-notice: "&c{player} declined the island invite."
  chat-prompt: "&eType the name of the player you want to invite in chat (or type '{cancel}'):"
  chat-cancelled: "&cInvite cancelled."

leave:
  not-member: "&cYou are not a member of any island!"
  owner-hint: "&cYou own this island - use /is usun to delete it."
  done: "&eYou left the island."
  notice: "&e{player} left your island."

role:
  usage: "&cUsage: /is {command} <player>"
  owner-only: "&cOnly the island owner can change roles."
  changed: "&aRole changed to {role}."
  changed-notice: "&bYour island role has been changed to {role}."
  owner: "Owner"
  admin: "Admin"
  member: "Member"

kick:
  usage: "&cUsage: /is remove <player>"
  managers-only: "&cOnly the owner and admins can remove members."
  admin-protected: "&cYou cannot remove another island admin."
  done: "&eRemoved {player} from the island."
  notice: "&cYou have been removed from {player}'s island."

bank:
  deposit-usage: "&cUsage: /is deposit <amount>"
  withdraw-usage: "&cUsage: /is withdraw <amount>"
  not-enough-money: "&cYou don't have enough money!"
  deposited: "&aDeposited {amount} to the island bank. New balance: {balance}."
  deposit-notice: "&a{player} deposited {amount} to your island bank!"
  not-enough-in-bank: "&cThe island bank doesn't have that much! Balance: {balance}."
  withdrew: "&aWithdrew {amount} from the island bank. New balance: {balance}."
  invalid-amount: "&cEnter a valid amount (a number)."
  amount-positive: "&cThe amount must be greater than zero."
  upgrade-no-money: "&cThe island bank doesn't have enough! Needed {cost}, the bank has {balance}. Deposit with /is deposit."

upgrade:
  max-size: "&cThe island has reached its maximum size ({max} blocks)!"
  border-done: "&aSuccess! The island area was expanded. New radius: {size} blocks."
  spawner-max: "&cThis stat is already at the maximum level!"
  spawner-done: "&aUpgraded to level {level}!"

name:
  prompt: "&eType the new island name in chat (max {max} characters, or type '{cancel}'):"
  cancelled: "&cIsland name change cancelled."
  length: "&cThe name must have 1-{max} characters."
  set: "&aIsland name set: {name}"

protection:
  break: "&cYou can't break this!"
  place: "&cYou can't place blocks on someone else's island!"
  fluid-place: "&cYou can't pour liquids on someone else's island!"
  fluid-take: "&cYou can't take liquids from someone else's island!"
  pvp: "&cPvP is disabled on this island!"
  mob-kill: "&cYou can't kill mobs on someone else's island!"
  containers: "&cYou can't open chests/containers on someone else's island!"
  interact: "&cYou can't use doors/mechanisms on someone else's island!"

