# ==========================================================================
# Tresc calego systemu questow - kategorie, ich layout GUI (menu glowne i
# kazda strona kategorii) i kazdy quest (tytul, opis, wymog, nagrody). Zero
# hardkodowanych stalych w Javie - caly uklad i tresc menu zyja TUTAJ.
# Osobny plik od quests.yml (POSTEP graczy, per-gracz, w plugins/) - ten
# plik to sama TRESC, wspolna dla wszystkich, kopiowana raz przy pierwszym
# uruchomieniu i NIGDY potem nadpisywana automatycznie.
#
# Przeladowanie na zywo, bez restartu serwera: /@reloadquesty
#
# main-menu.layout: 54-slotowa siatka menu "Kategorie Zadan" (klikniecie w
#   /zadania). Kazdy wpis to {slot: 0-53, role: ...}. role=CATEGORY_SLOT ->
#   kolejny wpis z category-order (i-ty CATEGORY_SLOT w tej liscie ->
#   category-order[i]). role=FILLER -> wypelniacz (domyslnie czarne szklo,
#   opcjonalne pole material nadpisuje je na tym jednym slocie). Slot spoza
#   listy = domyslny wypelniacz.
#
# category-order: kolejnosc kategorii bocznych odpowiadajaca kolejnosci
#   CATEGORY_SLOT w main-menu.layout (Glowna Sciezka NIE jest tu liczona
#   osobno - jej CATEGORY_SLOT to po prostu pierwszy wpis w layoucie, ktory
#   wskazuje na category-order[0]).
#
# titles: rejestr tytulow na czacie (id -> tekst z kodami koloru "&"),
#   nadawanych przez nagrode {type: TITLE, id: ...} (patrz nizej).
#
# categories.<ID>: jedna kategoria. Pola: display-name, icon (Material),
#   description, main-path (bool - DOKLADNIE jedna kategoria musi to miec
#   true), sequential (bool - quest N+1 zablokowany, dopoki N nieukonczony),
#   unlock (null albo {category: <ID zrodlowej kategorii>, quest-id: N} -
#   moze wskazywac na DOWOLNA kategorie, nie tylko main-path), page-layout
#   (jak main-menu.layout, ale role=QUEST_SLOT zamiast CATEGORY_SLOT - i-ty
#   QUEST_SLOT na danej stronie -> (strona * liczba_QUEST_SLOT + i)-ty quest
#   z listy quests), quests (lista).
#
# Kazdy quest: id (stabilne w ramach kategorii - NIE renumerowac istniejacych,
#   quest #16 Glownej Sciezki jest twardo zalinkowany w mainplugins-spawn pod
#   /warp kowal), title, description (lista linii), requirement, rewards
#   (lista - quest moze miec ich dowolnie wiele naraz), reward-label
#   (opcjonalne - jesli pominiete, etykieta sklada sie automatycznie z
#   nie-cichych rewards).
#
# requirement.type:
#   ITEM             - materials: [{material, amount, custom-id?, display-name?}]
#                      (custom-id/display-name tylko dla itemow tagowanych PDC,
#                      np. gatunek ryby albo trofeum z innego pluginu)
#   FREE             - brak pol, klikniecie od razu zdaje quest
#   MONEY            - amount (koszt w monetach)
#   TOOL_POSSESS     - material (posiadaj taki Material, NIE zabiera itemu)
#   TOOL_LEVEL       - tool (PICKAXE/AXE/SWORD - tylko te 3 maja dzis metode
#                      poziomu w ToolsService) + level
#   MARKET_OFFER     - brak pol, wymaga AKTUALNIE aktywnej oferty na Targu
#                      graczy (stan biezacy - jesli oferta zostanie sprzedana/
#                      wycofana, wymog przestaje byc spelniony)
#   BUY_ITEM         - material: {material, amount, custom-id?} - LICZNIK
#                      NARASTAJACY (nie stan biezacy): kup LACZNIE tyle sztuk
#                      w sklepie (mainplugins-shop), niezaleznie kiedy i ile
#                      razy - postep widoczny w lore questu, NIE zabiera
#                      przedmiotow po zdaniu
#   SELL_ITEM        - jak BUY_ITEM, tylko sprzedaz w sklepie (/sprzedaj,
#                      /sprzedajwszystko, PPM/Shift+PPM w GUI)
#   MARKET_LISTINGS  - amount - wystaw LACZNIE tyle ofert na Targu graczy w
#                      historii (licznik zdarzen wystawienia - w
#                      odroznieniu od MARKET_OFFER liczy sie NAWET jesli
#                      wczesniejsze oferty juz sprzedane/wycofane)
#
# rewards[].type (kazdy wpis moze miec dodatkowo silent: true - nie wchodzi
#   do auto-etykiety, dla "cichych" bonusow jak skrzynki milowe):
#   ITEM         - material, amount
#   CUSTOM_ITEM  - id, amount. Szuka NAJPIERW w rejestrze mainplugins-core/
#                  custom-items.yml, a jesli tam nieznane - w rejestrze
#                  mainplugins-tools/ewoluujace-narzedzia.yml (dowolny
#                  KILOF_.../SIEKIERA_.../HELM_... itd.) - z perspektywy
#                  questa to JEDEN wspolny "custom item", bez znaczenia w
#                  ktorym z dwoch plikow faktycznie zyje id.
#   MONEY        - amount
#   CRATE        - tier, fallback: RewardEntry[] (wreczany zamiast, gdy
#                  mainplugins-crates nie jest wgrany)
#   TOOL         - tool (PICKAXE/AXE/HOE/SWORD/SHOVEL - prawdziwe ewoluujace
#                  narzedzie z mainplugins-tools)
#   TITLE        - id (z sekcji titles wyzej)
# ==========================================================================

