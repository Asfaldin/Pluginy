# Quests - categories, quests and how the menu looks.
# Reload without a restart: /@quests reload
# Requirement types: free (just click), items (bring them, they are taken),
#   money (pay), have-item (have it with you, you keep it).
# Rewards use the shared "rewards:" format (money, item, custom, command, crate, key, title, unlock).
settings:
  join-reminder: true
  welcome-sound: "mainplugins:quest_welcome"
  filler: { item: BLACK_STAINED_GLASS_PANE }
  icons:
    available: { item: RED_DYE }
    completed: { item: LIME_DYE }
    locked: { item: GRAY_DYE }
    category-locked: { item: GRAY_DYE }
    category-empty: { item: BARRIER }
  buttons:
    back: { item: DARK_OAK_DOOR }
    prev: { item: ARROW }
    next: { item: ARROW }

main-menu:
  layout:
    - { slot: 13, role: CATEGORY_SLOT }
    - { slot: 29, role: CATEGORY_SLOT }
    - { slot: 30, role: CATEGORY_SLOT }
    - { slot: 31, role: CATEGORY_SLOT }
    - { slot: 32, role: CATEGORY_SLOT }
    - { slot: 33, role: CATEGORY_SLOT }

category-order: [main_path, mining, farming, hunting, fishing, woodcutting]

titles:
  beginner: "&7&l[Beginner] "

categories:
  main_path:
    name: "Main Path"
    icon: { item: KNOWLEDGE_BOOK }
    description: "Start here - quests in order!"
    main-path: true
    sequential: true
    after: null
    requires-unlock: null
    page-layout:
      - { slot: 10, role: QUEST_SLOT }
      - { slot: 11, role: QUEST_SLOT }
      - { slot: 12, role: QUEST_SLOT }
      - { slot: 13, role: QUEST_SLOT }
      - { slot: 14, role: QUEST_SLOT }
      - { slot: 15, role: QUEST_SLOT }
      - { slot: 16, role: QUEST_SLOT }
      - { slot: 25, role: QUEST_SLOT }
      - { slot: 24, role: QUEST_SLOT }
      - { slot: 23, role: QUEST_SLOT }
      - { slot: 45, role: NAV_PREV }
      - { slot: 49, role: NAV_BACK }
      - { slot: 53, role: NAV_NEXT }
    quests:
      - id: 1
        title: "Welcome"
        description: ["Your adventure starts now.", "Claim your first tools!"]
        requirement: { type: free }
        rewards:
          - item: WOODEN_PICKAXE
          - item: BREAD
            amount: 5
      - id: 2
        title: "First Wood"
        description: ["Chop some trees."]
        requirement: { type: items, items: [ { item: OAK_LOG, amount: 16 } ] }
        rewards:
          - item: STONE_AXE
          - money: 50
      - id: 3
        title: "Stone Age"
        description: ["Mine cobblestone for better tools."]
        requirement: { type: items, items: [ { item: COBBLESTONE, amount: 32 } ] }
        rewards:
          - item: STONE_PICKAXE
          - money: 50
      - id: 4
        title: "Light It Up"
        description: ["Craft torches - the night is less scary."]
        requirement: { type: items, items: [ { item: TORCH, amount: 16 } ] }
        rewards:
          - money: 100
      - id: 5
        title: "Fed and Ready"
        description: ["Bake some bread."]
        requirement: { type: items, items: [ { item: BREAD, amount: 5 } ] }
        rewards:
          - item: COOKED_BEEF
            amount: 8
      - id: 6
        title: "Iron Will"
        description: ["Smelt some iron."]
        requirement: { type: items, items: [ { item: IRON_INGOT, amount: 8 } ] }
        rewards:
          - item: IRON_PICKAXE
      - id: 7
        title: "Shield Up"
        description: ["Craft a shield and keep it with you."]
        requirement: { type: have-item, item: { item: SHIELD } }
        rewards:
          - money: 150
      - id: 8
        title: "Pay Your Dues"
        description: ["Show that you can earn money."]
        requirement: { type: money, amount: 200 }
        rewards:
          - crate: basic
            fallback:
              - money: 300
      - id: 9
        title: "Shiny"
        description: ["Find diamonds deep underground."]
        requirement: { type: items, items: [ { item: DIAMOND, amount: 3 } ] }
        rewards:
          - money: 500
      - id: 10
        title: "Veteran"
        description: ["Bring gold and earn your first title."]
        requirement: { type: items, items: [ { item: GOLD_INGOT, amount: 16 } ] }
        rewards:
          - title: beginner
          - money: 1000

