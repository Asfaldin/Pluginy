  confirm-phrase: "Yes I agree"
  owner-only: "&cOnly the owner can delete the island!"
  cancelled: "&eIsland deletion cancelled."
  done: "&cYour island has been permanently deleted."
  member-notice: "&cThe island you were on has been deleted by its owner."

