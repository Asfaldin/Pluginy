# Mainplugins Shop - settings (edited in the PluginManager app). Items and prices are in categories/<id>.yml.
categories:
  - bloki
  - roslinki
  - drewno
  - mineraly
  - moby
  - narzedzia
  - jedzenie
  - dekoracje
  - kolekcja
  - spawnery
price-rounding: whole
dynamic-prices:
  enabled: true
  cycle-minutes: 60
  min-multiplier: 0.5
  max-multiplier: 1.5
  reset-days: 14
  max-sell-share: 0.9
  announce-events: true
  announce-reset: true
  tuning:
    max-drop-per-cycle: 0.05
    drop-at-top: 4.2
    recover-from-below: 0.8
    rise-per-cycle: 0.125
    quiet-threshold: 0.1
    cycles-to-rise: 2
    cycles-frozen: 2
    norm-learn-rate: 0.02
stats:
  enabled: true
  history-days: 30
category-page-sort: order
center-small-categories: false
category-page-shared: false
sales:
  announce: true
rank-bonuses: {}
menus:
  main-menu:
    size: 54
    layout:
      - {slot: 4, role: SEARCH}
      - {slot: 49, role: EXIT}
