        na-poziom: 0.5
        max: 15
        enchant: efficiency
        enchant-mnoznik: 0.25
    enchanty:
      - enchant: fortune
        progresja: {15: 1, 30: 2}
    kamienie-milowe:
      3:
        - typ: CZASTKI_PRZY_TRIGGERZE
          szansa-bazowa: 100
          czastka: CRIT
          dzwiek: BLOCK_AMETHYST_BLOCK_CHIME
      6:
