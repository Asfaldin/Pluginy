# Gatunki ryb do lowienia w obszarach lowisk (patrz ObszarService, flaga ryby-dozwolone
# ustawiana /@obszar ryby w mainplugins-spawn). customId musi zgadzac sie 1:1 z
# mainplugins-shop (kategoria "ryby_wedkarskie") i z customId-ami wymogow questow kategorii
# "Rybak" w mainplugins-quests - to jedyny "kontrakt" laczacy te trzy niezalezne moduly
# (patrz CustomItemKeys w mainplugins-core). Jesli custom-id ma wpis w rejestrze custom itemow
# (mainplugins-core, custom-items.yml) to on wygrywa (wlasny model z resourcepacka), a
# material/name/color ponizej sluzy tylko jako fallback.
#
# 2026-08-29: rozszerzone z 6 do 30 gatunkow (po 5 na kazda z 6 rzadkosci, patrz
# RybaGatunek.Rzadkosc - drabinka "Wariant A": Zwykla/Niezwykla/Rzadka/Epicka/Legendarna/
# Mityczna). WSZYSTKIE 30 maja teraz wlasny model w custom-items.yml - oryginalnych 6
# (Karp/Dorsz/Sum/Strzelczyk/Wioslozab/Latimeria) ma modele z resourcepacka "AllTheFish V4"
# (namespace mainplugins), reszta (24 nowe) ma modele POZYCZONE z duzo wiekszej biblioteki
# tego samego autora - "AllTheFish V4 - 26.2" (namespace barely_default, 200 gatunkow w
# paczce) - patrz mainplugins-core/resourcepack/assets/barely_default/. Dobierane recznie
# tematycznie do kazdej nazwy (np. Szczupak -> pike, Marlin Blekitny -> blue_marlin,
# Zloty Karp Bogow -> golden_carp) - latwo podmienic pojedynczo w custom-items.yml, jesli
# ktos zrobi dla ktoregos gatunku wlasny, dedykowany model w przyszlosci.
#
# rarity: ZWYKLA / NIEZWYKLA / RZADKA / EPICKA / LEGENDARNA / MITYCZNA (od RZADKA w gore
#         ryba dostaje enchant glint w fallbackowym budowaniu itemu).
# weight:  waga losowania GATUNKU (im wyzsza, tym czesciej TEN GATUNEK wypada) - to NIE jest
#          procent bezposrednio, szansa = weight / suma wszystkich weight ponizej. NIE mylic
#          z waga fizyczna ryby w kg (patrz kg-* nizej) - to dwa zupelnie inne "wagi".
#
# Wagi losowania WCIAZ wyrownane (1 = kazda ryba w danej rzadkosci ma taka sama szanse) na
# czas testow - docelowy rozklad miedzy RZADKOSCIAMI (nie gatunkami) byl kiedys 50/30/5,
# teraz ze rzadkosci jest 6 trzeba to przemyslec na nowo i ustalic PRZED wdrozeniem na
# produkcje - wciaz nieodhaczone, teraz dotyczy juz wszystkich 30 gatunkow, nie tylko 6.
#
# kg-typowy-min / kg-typowy-max: typowy zakres fizycznej wagi zlowionej ryby w kg (patrz
#   FishingManager.losujWageDziesieteKg) - rozklad normalny wysrodkowany na srodku tego
#   zakresu, wiec WIEKSZOSC polowow wypada w okolicy tych granic.
# kg-min / kg-max: twardy limit - skrajnie rzadkie "jackpotowe" odchyly w dol/gore. Wynik
#   spoza tego przedzialu jest odrzucany i losowany ponownie (patrz ILOSC_SIGMA_DO_MAKSIMUM
#   w FishingManager - kazdy gatunek ma ~1/31500 szanse na wynik blisko WLASNEGO kg-max).
#
# Kazdy gatunek ma WLASNY zakres kg - ogolny trend to "wyzsza rzadkosc = wiecej kg" (srednia
# typowego zakresu na rzadkosc rosnie: Zwykla ~13kg -> Niezwykla ~28kg -> Rzadka ~50kg ->
# Epicka ~66kg -> Legendarna ~102kg -> Mityczna ~113-125kg), ale w obrebie jednej rzadkosci
# gatunki tez sie roznia (czasem mocno, czasem prawie wcale - user 2026-08-29 chcial
# realistyczna, nie mechaniczna progresje). MITYCZNA ma swiadomy wyjatek: Zloty Karp Bogow
# jest ZDECYDOWANIE ciezszy od pozostalych 4 mitycznych gatunkow - prawdziwy "swiety graal"
# calego systemu, jedyna ryba z limitem siegajacym 200kg.
