# Mainplugins Blocks - English messages. Colors: &a &e ...  Placeholders: {name}
reward:
  block: "&aYou received &e{amount}x {block}&a."
admin:
  usage: "&eUsage: /@block give <block> [player] [amount] | list | reload"
