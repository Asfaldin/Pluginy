name: MainpluginsSpawners
version: ${project.version}
main: elo.mainplugins.spawners.MainpluginsSpawners
api-version: '1.20'
depend: [MainpluginsCore]
softdepend: [MainpluginsSkyblock]

commands:
  spawnery:
    description: Spawner upgrades - more mobs at once or more often
    usage: /<command>
    aliases: [spawners]
  "@reloadspawnery":
    description: Wczytaj spawnery-typy.yml na nowo, bez restartu serwera
    permission: mainplugins.spawners.reload
    permission-message: "&cNie masz permisji do tej komendy!"

permissions:
  mainplugins.spawners.reload:
    description: Pozwala przeładować typy i ustawienia customowych spawnerów
    default: op
