# ==========================================================================
# bruk-szanse.yml - szansa % na to, ze skopanie bruku (COBBLESTONE) doda do wypadajacych
# przedmiotow bonusowy surowiec. Kazdy tier kilofa ma WLASNA, niezalezna wartosc - im
# wyzszy tier, tym wieksza pula mozliwych surowcow (kumulatywnie, patrz BrukSurowce.java
# w kodzie), ale sama szansa % edytowana jest tylko tutaj, na zywo (wystarczy zmienic
# plik i zrestartowac serwer - nie trzeba przebudowywac pluginu).
#
# Tiery kilofa: 0=Drewniany 1=Kamienny 2=Zelazny 3=Diamentowy 4=Netherytowy
# Wartosci sa w procentach (np. 8.0 = 8%). Na razie wszystkie rowne - do wywazenia.
# ==========================================================================

tiery:
  0: 5.0
  1: 5.0
  2: 5.0
  3: 5.0
  4: 5.0