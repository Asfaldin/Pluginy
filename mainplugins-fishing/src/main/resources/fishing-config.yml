# Konfiguracja lowienia (mainplugins-fishing) - tuning minigry i bonusowej skrzynki,
# w pelni edytowalny bez rekompilacji. Przeladowanie na zywo: /@reloadfishing
#
# Gatunki ryb NIE sa tutaj - patrz ryby.yml (osobny plik w tym samym folderze danych).

# Trudnosc minigry "pasek" zalezna liniowo od trudnosci = rzadkosc.ordinal() (0-4):
# polowa-szerokosci-suwaka(t) = clamp(bazowa + na-trudnosc*t, min, max)
# predkosc-ryby(t)            = clamp(bazowa + na-trudnosc*t, min, max)
# tempo-napelniania(t)        = clamp(bazowa + na-trudnosc*t, min, max)
# tempo-oprozniania(t)        = clamp(bazowa + na-trudnosc*t, min, max)
minigra:
  szerokosc-paska: 40
  grawitacja: 0.65
  impuls-kliknieca: 0.38
  okres-tickow: 2
  maksymalny-czas-sekund: 30
  polowa-szerokosci-suwaka: {bazowa: 0.10, na-trudnosc: -0.011, min: 0.05, max: 0.10}
  predkosc-ryby: {bazowa: 0.10, na-trudnosc: 0.05, min: 0.0, max: 999.0}
  tempo-napelniania: {bazowa: 0.18, na-trudnosc: -0.015, min: 0.10, max: 0.18}
  tempo-oprozniania: {bazowa: 0.12, na-trudnosc: 0.02, min: 0.12, max: 0.20}

bonusowa-skrzynka:
  szansa-procent: 3.0
