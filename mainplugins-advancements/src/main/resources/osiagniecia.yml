# ─────────────────────────────────────────────────────────────────────────────
#  osiagniecia.yml - system osiągnięć zbudowany NA wbudowanych advancementach.
#
#  Ten zestaw jest w 100% SERWEROWY - żadne osiągnięcie nie jest spięte z
#  waniliowym triggerem MC. Wszystkie warunki liczą realną grę na tym serwerze
#  (kopanie z generatora, minigra łowienia, ekonomia, rangi, czas gry, bossowie).
#
#  Źródła zdobycia (pole "zrodlo"):
#
#   • vanilla:<klucz>          - [nadal wspierane] powiązanie z wbudowanym
#                                 advancementem MC; w tym pliku NIEUŻYWANE.
#   • custom:kasa              - miej na koncie ≥ "prog" złotówek
#   • custom:ranga             - miej rangę ≥ "ranga" (GRACZ < VIP < ADMIN)
#   • custom:czas-gry          - przegraj łącznie ≥ "godziny" godzin
#   • custom:advancementy      - ukończ łącznie ≥ "prog" DOWOLNYCH advancementów
#   • custom:statystyka        - wbudowana statystyka ≥ "prog"; dla statystyk
#                                 blokowych/itemowych podaj "material", dla
#                                 mobowych "istota" (EntityType)
#
#  Nagrody ("nagrody:", lista) - typy: MONEY, ITEM, CUSTOM_ITEM, CRATE, COMMAND.
#  Nagroda NIE jest wręczana automatycznie - gracz odbiera ją klikając w GUI
#  (chyba że ustawisz "auto: true" na osiągnięciu).
#
#  DATAPACK (sekcja "datapack:") - gdy włączony, plugin generuje datapack w
#  <świat>/datapacks/mainplugins-osiagniecia/, dzięki czemu osiągnięcia
#  pojawiają się w natywnym ekranie ESC → Postępy jako własne zakładki + toast.
#  To nie NMS - zwykłe pliki JSON czytane przez waniliowe MC. Zmiany widoczne
#  dopiero po /reload lub restarcie serwera (plugin przypomni w konsoli).
#
#  Przeładowanie na żywo: /@reloadosiagniecia
# ─────────────────────────────────────────────────────────────────────────────

gui:
  tytul: "&8» &6Osiągnięcia"
  rozmiar: 54            # wielokrotność 9, 18-54; ostatni rząd to nawigacja
  tlo: GRAY_STAINED_GLASS_PANE

powiadomienia:
  dzwiek: "ui.toast.challenge_complete"   # surowy klucz dźwięku (Player#playSound)
  tytul: "&6&lOSIĄGNIĘCIE ZDOBYTE"
  podtytul: "&e%nazwa%"
  efekt-rzadkich: true                    # widowiskowy efekt dla "spektakularne: true"

sprawdzanie-co-sekund: 10                 # jak często sprawdzać warunki custom

nagrody:
  # true  = nagroda leci OD RAZU przy zdobyciu (bez klikania w /osiagniecia).
  #         Gdy brak miejsca w ekwipunku - przedmioty czekają w kolejce i lecą
  #         automatycznie, gdy miejsce się zwolni (przy zamknięciu ekwipunku,
  #         wejściu na serwer i cyklicznie).
  # false = nagrody odbierane ręcznie klikiem w GUI /osiagniecia.
  # Pojedyncze osiągnięcie może to nadpisać własnym polem "auto: true/false".
  auto-wszystkie: true

datapack:
  wlaczony: true                         # generuj datapack → osiągnięcia w ESC → Postępy
  namespace: mpa                         # przestrzeń nazw advancementów (a-z, 0-9, _.-)
  tlo-domyslne: "minecraft:textures/block/cobblestone.png"   # tło drzewka, gdy kategoria nie poda własnego

# ─────────────── UKRYCIE WBUDOWANYCH ADVANCEMENTÓW MC ───────────────
# Gdy wlaczone: datapack nadpisuje KAŻDY waniliowy advancement 5 natywnych
# zakładek (story / nether / end / adventure / husbandry) - łącznie z ich rootami -
# wersją bez "display", więc te zakładki znikają z ekranu ESC → Postępy w całości.
# Zostają tylko nasze zakładki mpa (poniższe kategorie). minecraft:recipes/* nietknięte.
# UWAGA: po włączeniu natywne advancementy (Getting Wood, Diamonds!, zabicie Smoka...)
# nie odpalają się - jeśli coś (mapa, inny plugin) na tym polega, przestanie działać.
vanilla-przejecie:
  wlaczone: true

# ─────────────── ZAKŁADKI (drzewka w ESC → Postępy) ───────────────
# tlo-zakladki (opcjonalne) - tekstura tła drzewka w natywnym ekranie.
