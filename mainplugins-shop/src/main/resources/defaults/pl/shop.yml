# Mainplugins Sklep - ustawienia. Przedmioty i ceny są w categories/<id>.yml (jeden plik na kategorię).
# Teksty (tytuły, przyciski, wiadomości) są w lang/en.yml i lang/pl.yml.
# Wczytanie bez restartu: /@shop reload

# Kolejność kategorii w menu głównym (nazwy plików z categories/ bez .yml).
categories: [blocks, farming, ores, mob-drops, food]

# Jak zaokrąglać ceny, gdy gracz kupuje część paczki albo ceny dynamiczne je zmieniają:
#   whole = pełne złotówki (1 sztuka z paczki "64 za 10" kosztuje 1)
#   cents = grosze (1 sztuka z paczki "64 za 10" kosztuje 0.16)
price-rounding: cents

# Ceny skupu reagują na sprzedaż: dużo sprzedaży -> cena spada, nikt nie sprzedaje -> rośnie.
dynamic-prices:
  enabled: true
  cycle-minutes: 60        # co ile minut przeliczać ceny
  min-multiplier: 0.5      # najniższy skup = 50% zwykłego
  max-multiplier: 1.5      # najwyższy skup = 150% zwykłego
  reset-days: 14           # co tyle dni wszystkie ceny wracają do normy
  max-sell-share: 0.9      # skup nigdy nie daje więcej niż 90% ceny kupna
  announce-events: true    # ogłoś na czacie, gdy event (/@shop event) się zaczyna albo kończy
  announce-reset: true     # ogłoś na czacie, gdy wszystkie ceny wracają do normy (co reset-days)
  # Strojenie mechaniki - domyślne wartości są przemyślane, zmieniaj tylko, gdy wiesz, co robisz.
  tuning:
    max-drop-per-cycle: 0.05   # ile najwyżej spada skup w jednym cyklu przy zwykłej cenie (0.05 = 5%)
    drop-at-top: 4.2           # ile razy mocniejszy jest spadek, gdy cena stoi na maksimum
    recover-from-below: 0.8    # jaka część drogi do zwykłej ceny wraca w jednym cyklu ciszy
    rise-per-cycle: 0.125      # o ile rośnie cena na cykl, gdy przedmiotu nikt nie sprzedaje
    quiet-threshold: 0.1       # sprzedaż poniżej tej części normy liczy się jako cisza
    cycles-to-rise: 2          # ile cykli ciszy, zanim cena zacznie rosnąć ponad zwykłą
    cycles-frozen: 2           # ile cykli cena stoi na zwykłej po zejściu z góry
    norm-learn-rate: 0.02      # jak szybko sklep zapomina stare cykle (0.02 = jakiś tydzień historii)

# Statystyki sprzedaży (stats.yml + stats.csv do Excela) z podpowiedziami, które ceny zmienić.
# Razem z nimi sklep zapisuje historię (history.yml): ile sprzedano i kto ile zarobił - /@shop history i /@shop top.
stats:
  enabled: false
  history-days: 30         # ile dni historii pamiętać

# Promocje na kupno (/@shop sale): czy ogłaszać początek i koniec na czacie.
sales:
  announce: true

# Premie rang. Gracz ma rangę, gdy ma uprawnienie mainplugins.shop.rank.<nazwa> (np. mainplugins.shop.rank.vip).
# buy-discount = tyle procent taniej przy kupnie, sell-bonus = tyle procent więcej za sprzedaż.
# Promocja i rabat rangi się sumują. Gracz z kilkoma rangami dostaje największą premię.
rank-bonuses:
  vip:
    buy-discount: 2
    sell-bonus: 1

