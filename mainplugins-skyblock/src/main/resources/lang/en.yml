  day-one: "day"
  day-few: "days"
  day-many: "days"
  hour-one: "hour"
  hour-few: "hours"
  hour-many: "hours"
  minute-one: "minute"
  minute-few: "minutes"
  minute-many: "minutes"
  second-one: "second"
  second-few: "seconds"
  second-many: "seconds"
